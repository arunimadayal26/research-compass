    { name = "arunimadayal26", email = "arunimadayal2608@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
